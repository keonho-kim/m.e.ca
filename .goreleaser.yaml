# Purpose: Build minimum and full MECA archives for four macOS/Linux platform targets.
# Pattern: Release configuration.
# Usage: go tool -modfile=devtools/go.mod goreleaser release --clean.
# Related: devtools/go.mod, docs/releases.md, cmd/meca/main.go.
version: 2
project_name: meca

builds:
  - id: minimum
    main: ./cmd/meca
    binary: meca
    env:
      - CGO_ENABLED=0
    tags:
      - godbus_no_tcp
      - minimum
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: full
    main: ./cmd/meca
    binary: meca
    env:
      - CGO_ENABLED=0
    tags:
      - godbus_no_tcp
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: minimum
    ids:
      - minimum
    formats:
      - tar.gz
    name_template: 'meca_{{ .Version }}_minimum_{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}'
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
  - id: full
    ids:
      - full
    formats:
      - tar.gz
    name_template: 'meca_{{ .Version }}_full_{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}'
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - src: webui/dist/THIRD_PARTY_NOTICES.txt
        dst: WEBUI_THIRD_PARTY_NOTICES.txt

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ readFile ".release-version" }}.{{ .Now.Format "20060102" }}-snapshot'

changelog:
  disable: true

release:
  github:
    owner: keonho-kim
    name: m.e.ca
  prerelease: auto
  mode: keep-existing
  header: '{{ readFile "docs/release-notes.md" }}'
