# Purpose: Verify main and publish daily macOS/Linux releases with explicitly configured major/minor values.
# Pattern: Serialized release workflow.
# Usage: Runs on main pushes or manual dispatch from main.
# Related: .release-version, scripts/release/prepare.sh, scripts/release/publish.sh, .goreleaser.yaml.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'keonho-kim/m.e.ca' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: devtools/go.mod
          cache-dependency-path: |
            go.sum
            devtools/go.sum

      - name: Prepare daily version
        id: version
        run: bash scripts/release/prepare.sh >> "$GITHUB_OUTPUT"

      - name: Verify source
        env:
          GOFLAGS: -tags=godbus_no_tcp
        run: |
          go test ./...
          go vet ./...
          go mod verify

      - name: Build release archives
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ steps.version.outputs.goreleaser }}
          args: release --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}

      - name: Publish verified release
        id: publish
        run: bash scripts/release/publish.sh
        env:
          GH_TOKEN: ${{ github.token }}
          MECA_RELEASE_TAG: ${{ steps.version.outputs.tag }}
          MECA_PREVIOUS_TAG: ${{ steps.version.outputs.previous }}

      - name: Summarize release
        if: steps.publish.outputs.published == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          printf 'Published [M.E.CA %s](https://github.com/%s/releases/tag/%s) for macOS/Linux (amd64/arm64).\n' \
            "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
