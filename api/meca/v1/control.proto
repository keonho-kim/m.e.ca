// Purpose: Define typed server commands shared by HTTP, WebSocket and Protobuf RPC.
// Pattern: Versioned external wire contract.
// Usage: Generate Go messages with protoc; see docs/server.md.
// Related: api/meca/v1/state.proto, api/meca/v1/service.proto.
syntax = "proto3";
package meca.v1;
option go_package = "github.com/keonho-kim/meca/internal/serverapi/gen/mecav1;mecav1";

message Empty {}
message Command {
  // Correlates replies on a socket. It is separate from StartRequest.key.
  string id = 1;
  oneof operation {
    SessionListRequest list_sessions = 10;
    SelectSession select_session = 11;
    Empty close_session = 12;
    Empty state = 13;
    HistoryRequest history = 14;
    DetailRequest detail = 15;
    ModelRequest set_model = 16;
    SettingsRequest set_settings = 17;
    StartRequest start = 18;
    TaskRequest task_status = 19;
    TaskRequest cancel = 20;
    ApprovalDecision approve = 21;
    SteeringRequest steer = 22;
  }
}
message SelectSession { string session_id = 1; bool create = 2; }
message SessionListRequest { string cursor = 1; int32 limit = 2; }
message HistoryRequest { int64 before = 1; int32 limit = 2; }
message EventReference { string session_id = 1; int64 sequence = 2; }
message DetailRequest {
  oneof source {
    EventReference tool = 1;
    string approval_id = 2;
    int64 history_sequence = 3;
  }
  int64 offset = 4;
  int32 limit = 5;
}
message ModelRequest {
  string provider = 1;
  string endpoint = 2;
  string model = 3;
  // Sent only over authenticated control requests; never returned or journaled.
  string credential = 4;
  optional bool thinking = 5;
  optional string reasoning_effort = 6;
  bool remember = 7;
}
message SettingsRequest { optional string permission = 1; optional bool team = 2; }
message StartRequest {
  string session_id = 1;
  // Caller-generated stable key, 8..128 bytes. Reusing it never repeats work.
  string key = 2;
  string text = 3;
}
message TaskRequest { string task_id = 1; }
message ApprovalDecision { string task_id = 1; string approval_id = 2; bool allow = 3; }
message SteeringRequest { string task_id = 1; string text = 2; }
message WatchRequest { string cursor = 1; }

// Socket clients authenticate before sending any commands or subscriptions.
message SocketFrame {
  oneof body {
    string authenticate = 1;
    Command command = 2;
    WatchRequest watch = 3;
    Empty unwatch = 4;
  }
}
